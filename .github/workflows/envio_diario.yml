name: Envio Diario OSINT

on:
  schedule:
    # 06:00 UTC y 18:00 UTC (8:00 AM y 8:00 PM en horario de verano / UTC+2)
    - cron: '0 6,18 * * *'
    # 07:00 UTC y 19:00 UTC (8:00 AM y 8:00 PM en horario de invierno / UTC+1)
    - cron: '0 7,19 * * *'
  workflow_dispatch:

jobs:
  ejecutar-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar rastreador y enviar email
        env:
          EMAIL_EMISOR: ${{ secrets.EMAIL_EMISOR }}
          PASSWORD_EMISOR: ${{ secrets.PASSWORD_EMISOR }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
        run: python enviar_informe_diario.py
